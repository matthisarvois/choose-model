[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "train-models"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "streamlit",
  "pandas",
  "numpy",
  "scikit-learn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]